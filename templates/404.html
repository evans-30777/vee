{% extends "base.html" %}

{% block content %}
<section class="section">
    <div class="container container--narrow" style="text-align:center">
        <p class="eyebrow" style="justify-content:center">Error 404</p>
        <h1 style="margin-block:1rem 1.25rem">This page doesn't exist</h1>
        <p class="lead" style="margin-inline:auto">
            The page you're looking for has moved or was never here. Let's get you back on track.
        </p>

        <div class="btn-row" style="justify-content:center; margin-top:2rem">
            <a class="btn btn--primary btn--lg" href="{% url 'core:home' %}">Back to home</a>
            <a class="btn btn--secondary btn--lg" href="{% url 'services:list' %}">See our services</a>
        </div>

        <p class="dim" style="margin-top:2.5rem">
            Looking for something specific?
            <a href="{% url 'contact:contact' %}" style="color:var(--brand-ink)">Get in touch</a> and we'll point you to it.
        </p>
    </div>
</section>
{% endblock %}
